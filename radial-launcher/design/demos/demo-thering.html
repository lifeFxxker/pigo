<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>TheRing 风格 · 径向启动器 Demo</title>
<style>
  :root {
    /* 玻璃盘：亮色振动感，跟随壁纸染色（TheRing 截图同款） */
    --disc-alpha: 0.30;
    --disc-blur: 26px;
    --text: rgba(20, 20, 26, 0.88);
    --text-dim: rgba(20, 20, 26, 0.55);
    --spring: cubic-bezier(0.34, 1.42, 0.5, 1);
    --ease: cubic-bezier(0.25, 0.8, 0.3, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI Variable', 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    cursor: default;
    user-select: none;
    -webkit-user-select: none;
  }

  /* ── 壁纸背景：macOS Sonoma 风格彩色渐变 + 光斑，让玻璃盘"染"上颜色 ── */
  .wall {
    position: fixed; inset: -40px; z-index: 0;
    background:
      radial-gradient(900px 700px at 18% 12%, rgba(255, 255, 255, 0.85) 0%, transparent 55%),
      radial-gradient(1100px 800px at 85% 20%, rgba(186, 200, 255, 0.75) 0%, transparent 60%),
      radial-gradient(1200px 900px at 70% 90%, rgba(255, 214, 170, 0.55) 0%, transparent 58%),
      linear-gradient(160deg, #7f8df0 0%, #6f7ce8 30%, #5a6bd8 55%, #7aa0e8 78%, #9fc4f0 100%);
  }
  .wall::before {
    content: ''; position: absolute; inset: 0;
    background:
      radial-gradient(700px 420px at 45% 55%, rgba(255, 255, 255, 0.35) 0%, transparent 60%),
      linear-gradient(115deg, transparent 42%, rgba(255, 255, 255, 0.5) 50%, transparent 58%);
    filter: blur(6px);
  }

  /* ── 提示条 ── */
  .hint {
    position: fixed; left: 50%; bottom: 26px; transform: translateX(-50%);
    z-index: 5; padding: 9px 18px; border-radius: 999px;
    background: rgba(15, 15, 20, 0.55); color: rgba(255, 255, 255, 0.85);
    font-size: 13px; letter-spacing: 0.02em;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border: 1px solid rgba(255, 255, 255, 0.14);
    transition: opacity 0.4s var(--ease);
  }
  .hint b { font-weight: 650; }
  body.holding .hint { opacity: 0.25; }

  .toast {
    position: fixed; left: 50%; top: 34px; transform: translateX(-50%) translateY(-8px);
    z-index: 9; padding: 10px 20px; border-radius: 14px;
    background: rgba(20, 20, 26, 0.72); color: #fff; font-size: 13.5px; font-weight: 500;
    backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
    border: 1px solid rgba(255, 255, 255, 0.16);
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
    opacity: 0; pointer-events: none;
    transition: opacity 0.28s var(--ease), transform 0.28s var(--spring);
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ══════════ 玻璃圆盘（TheRing 主体） ══════════ */
  .ring {
    position: fixed; z-index: 10; left: 0; top: 0;
    width: 0; height: 0;           /* 定位锚点 = 圆心 */
    pointer-events: none;
    opacity: 0; transform: scale(0.62);
    transition: opacity 0.22s var(--ease), transform 0.34s var(--spring);
  }
  body.holding .ring { opacity: 1; transform: scale(1); transition-timing-function: var(--ease), var(--spring); }

  /* 盘面：一整块玻璃 */
  .disc {
    position: absolute; left: 0; top: 0;
    width: 460px; height: 460px; margin: -230px 0 0 -230px;
    border-radius: 50%;
    background: rgba(252, 252, 255, var(--disc-alpha));
    backdrop-filter: blur(var(--disc-blur)) saturate(170%) brightness(1.06);
    -webkit-backdrop-filter: blur(var(--disc-blur)) saturate(170%) brightness(1.06);
    box-shadow:
      0 24px 70px rgba(20, 20, 60, 0.28),
      inset 0 1px 1px rgba(255, 255, 255, 0.65),
      inset 0 -1px 1px rgba(255, 255, 255, 0.18),
      inset 0 0 0 1px rgba(255, 255, 255, 0.22);
  }
  .disc::after {   /* 斜向镜面高光 */
    content: ''; position: absolute; inset: 0; border-radius: 50%;
    background: linear-gradient(128deg,
      rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0.06) 22%,
      transparent 46%, transparent 70%, rgba(255, 255, 255, 0.16) 100%);
    mix-blend-mode: screen;
  }

  /* 中心子圆：显示悬停应用名 */
  .hub {
    position: absolute; left: 0; top: 0;
    width: 186px; height: 186px; margin: -93px 0 0 -93px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 7px;
  }
  .hub .name {
    font-size: 17px; font-weight: 600; color: var(--text);
    letter-spacing: 0.04em;
    transition: opacity 0.16s var(--ease), transform 0.16s var(--ease);
  }
  .hub .name.swap { opacity: 0; transform: translateY(4px) scale(0.96); }
  .hub .count {
    font-size: 12px; font-weight: 500; color: var(--text-dim);
    padding: 2px 10px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.3);
  }

  /* ── 应用图标（内环，立在盘面上） ── */
  .app {
    position: absolute; left: 0; top: 0;
    pointer-events: auto; cursor: pointer;
    opacity: 0;
    transform: rotate(var(--a)) translateY(-158px) rotate(calc(var(--a) * -1)) scale(0.3);
    transition: opacity 0.18s var(--ease), transform 0.3s var(--spring);
  }
  body.holding .app { opacity: 1; transform: rotate(var(--a)) translateY(-158px) rotate(calc(var(--a) * -1)) scale(1); }
  .app .tile {
    position: absolute; left: -28px; top: -28px;
    width: 56px; height: 56px; border-radius: 14.5px;
    display: flex; align-items: center; justify-content: center;
    box-shadow:
      0 5px 14px rgba(20, 20, 50, 0.28),
      inset 0 1px 1px rgba(255, 255, 255, 0.4),
      inset 0 -1px 2px rgba(0, 0, 0, 0.12);
    transition: transform 0.16s var(--spring), box-shadow 0.16s var(--ease);
  }
  .app .tile svg { width: 30px; height: 30px; }
  .app:hover .tile { transform: scale(1.12); }
  /* 选中环：TheRing 的圆角方框 */
  .app .sel {
    position: absolute; left: -37.5px; top: -37.5px;
    width: 72px; height: 72px;
    border-radius: 19px;
    border: 2px solid rgba(255, 255, 255, 0.92);
    box-shadow: 0 0 0 3px rgba(255, 255, 255, 0.22), 0 6px 18px rgba(20, 20, 50, 0.2);
    opacity: 0; transform: scale(0.82);
    transition: opacity 0.14s var(--ease), transform 0.18s var(--spring);
  }
  .app:hover .sel { opacity: 1; transform: scale(1); }
  .app.dim { opacity: 0.42; }
  .app.dim .tile { transform: scale(0.94); }
  /* 角标 */
  .badge {
    position: absolute; right: -5px; top: -5px; z-index: 2;
    min-width: 19px; height: 19px; padding: 0 5px; border-radius: 999px;
    background: linear-gradient(180deg, #ff6f5e, #f43f2e);
    color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 2px 6px rgba(200, 30, 20, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.35);
  }

  /* ── 外环内容 chips：悬停应用后从盘沿扇出 ── */
  .chip {
    position: absolute; left: 0; top: 0;
    pointer-events: none; cursor: pointer;
    display: flex; align-items: center; gap: 7px;
    padding: 7px 14px 7px 9px; border-radius: 999px;
    background: rgba(252, 252, 255, 0.34);
    backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%);
    border: 1px solid rgba(255, 255, 255, 0.5);
    box-shadow: 0 6px 18px rgba(20, 20, 50, 0.2), inset 0 1px 1px rgba(255, 255, 255, 0.6);
    white-space: nowrap;
    font-size: 13px; font-weight: 550; color: var(--text);
    opacity: 0;
    transition: opacity 0.16s var(--ease), transform 0.22s var(--spring), background 0.14s var(--ease);
  }
  .chip .dot {
    width: 20px; height: 20px; border-radius: 7px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-style: normal;
    box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.4);
  }
  .chip:hover { background: rgba(255, 255, 255, 0.62); transform-origin: center; }
  body.holding .chip.on { opacity: 1; pointer-events: auto; }
  .chip.pulse { animation: chippulse 0.32s var(--ease); }
  @keyframes chippulse {
    0% { filter: brightness(1); } 40% { filter: brightness(1.5); } 100% { filter: brightness(1); }
  }

  .gonescale { transform: translate(-50%,-50%) scale(0.8) !important; opacity: 0 !important; }
</style>
</head>
<body>
<div class="wall"></div>

<div class="ring" id="ring">
  <div class="disc"></div>
  <div class="hub">
    <div class="name" id="hubName">启动器</div>
    <div class="count" id="hubCount">8 个应用</div>
  </div>
</div>

<div class="hint">按住 <b>鼠标中键</b> 召唤 · 悬停应用展开内容 · 松开启动 &nbsp;｜&nbsp; 按 <b>T</b> 切换明暗盘面</div>
<div class="toast" id="toast"></div>

<script>
/* ── 数据：内环 = 常用应用，每个应用带自己的内容项（外环） ── */
const APPS = [
  { name: '浏览器', grad: 'linear-gradient(145deg,#4cd0ff,#0b93e8)', count: 5,
    items: [
      { t: '豆包',    bg: 'linear-gradient(145deg,#7aa8ff,#4c6ef5)', g: '' },
      { t: 'GitHub',  bg: 'linear-gradient(145deg,#4a4a52,#1b1b20)', g: '' },
      { t: '知乎',    bg: 'linear-gradient(145deg,#58a6ff,#0066ff)', g: '' },
      { t: '哔哩哔哩', bg: 'linear-gradient(145deg,#ff9db8,#f06a92)', g: '' },
      { t: 'Gmail',   bg: 'linear-gradient(145deg,#ff8f8f,#ea4335)', g: 'M' },
    ]},
  { name: '资源管理器', grad: 'linear-gradient(145deg,#ffe08a,#f5b93d)', count: 4,
    items: [
      { t: '下载',     bg: 'linear-gradient(145deg,#9db3c8,#5f7b96)', g: '⤓' },
      { t: '文档',     bg: 'linear-gradient(145deg,#9db3c8,#5f7b96)', g: '≡' },
      { t: '桌面',     bg: 'linear-gradient(145deg,#9db3c8,#5f7b96)', g: '▭' },
      { t: '项目目录', bg: 'linear-gradient(145deg,#9db3c8,#5f7b96)', g: '⋊' },
    ]},
  { name: 'VS Code', grad: 'linear-gradient(145deg,#3aa0f8,#0c63b8)', count: 3,
    items: [
      { t: 'pigo',            bg: 'linear-gradient(145deg,#3aa0f8,#0c63b8)', g: '{}' },
      { t: 'radial-launcher', bg: 'linear-gradient(145deg,#3aa0f8,#0c63b8)', g: '{}' },
      { t: 'chrome_starter',  bg: 'linear-gradient(145deg,#3aa0f8,#0c63b8)', g: '{}' },
    ]},
  { name: '微信', grad: 'linear-gradient(145deg,#6ee88a,#2bb848)', badge: 3, count: 3,
    items: [
      { t: '文件传输助手', bg: 'linear-gradient(145deg,#6ee88a,#2bb848)', g: '微' },
      { t: '扫一扫',       bg: 'linear-gradient(145deg,#6ee88a,#2bb848)', g: '.Scan' },
      { t: '收付款',       bg: 'linear-gradient(145deg,#6ee88a,#2bb848)', g: '¥' },
    ]},
  { name: '网易云音乐', grad: 'linear-gradient(145deg,#ff7d7d,#e31515)', count: 3,
    items: [
      { t: '每日推荐',   bg: 'linear-gradient(145deg,#ff7d7d,#e31515)', g: '♪' },
      { t: '私人FM',     bg: 'linear-gradient(145deg,#ff7d7d,#e31515)', g: '𝄞' },
      { t: '我喜欢的音乐', bg: 'linear-gradient(145deg,#ff7d7d,#e31515)', g: '♥' },
    ]},
  { name: '终端', grad: 'linear-gradient(145deg,#4a4a52,#17171c)', count: 2,
    items: [
      { t: 'PowerShell', bg: 'linear-gradient(145deg,#4a4a52,#17171c)', g: '>_' },
      { t: 'WSL',        bg: 'linear-gradient(145deg,#e8b44c,#d35400)', g: '$' },
    ]},
  { name: '邮件', grad: 'linear-gradient(145deg,#6fb6ff,#1a6fe8)', badge: 5, count: 5,
    items: [
      { t: '所有收件箱', bg: 'linear-gradient(145deg,#6fb6ff,#1a6fe8)', g: '✉' },
      { t: '工作',       bg: 'linear-gradient(145deg,#6fb6ff,#1a6fe8)', g: '✉' },
      { t: '账单',       bg: 'linear-gradient(145deg,#6fb6ff,#1a6fe8)', g: '✉' },
      { t: '订阅',       bg: 'linear-gradient(145deg,#6fb6ff,#1a6fe8)', g: '✉' },
      { t: '已加星标',   bg: 'linear-gradient(145deg,#ffcf4c,#f5a623)', g: '★' },
    ]},
  { name: '设置', grad: 'linear-gradient(145deg,#c8cdd6,#7d8592)', count: 3,
    items: [
      { t: '常用应用', bg: 'linear-gradient(145deg,#c8cdd6,#7d8592)', g: '⚙' },
      { t: '系统项',   bg: 'linear-gradient(145deg,#c8cdd6,#7d8592)', g: '⚙' },
      { t: '关于',     bg: 'linear-gradient(145deg,#c8cdd6,#7d8592)', g: 'ⓘ' },
    ]},
];

/* 白色线性图标（内环应用） */
const GLYPHS = {
  '浏览器':   '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5 13 13l-4.5 2.5L11 11z" fill="#fff" stroke="none"/></svg>',
  '资源管理器':'<svg viewBox="0 0 24 24" fill="#fff"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4l2 2.5h7A1.5 1.5 0 0 1 19 9v8.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 3 17.5z"/></svg>',
  'VS Code':  '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5 4 12l5 7M15 5l5 7-5 7"/></svg>',
  '微信':     '<svg viewBox="0 0 24 24" fill="#fff"><path d="M9.2 4C5.2 4 2 6.7 2 10c0 1.9 1 3.5 2.7 4.6l-.7 2.1 2.4-1.2c.6.2 1.2.3 1.9.35A5.8 5.8 0 0 1 8 14c0-3.1 3-5.6 6.6-5.6h.3C14.2 5.8 11.9 4 9.2 4zM7 7.4a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8zm4.5 0a.9.9 0 1 1 0 1.8.9.9 0 0 1 0-1.8z"/><path d="M22 14c0-2.8-2.7-5-6-5s-6 2.2-6 5 2.7 5 6 5c.7 0 1.4-.1 2-.3l2 1-.6-1.8c1.6-.9 2.6-2.3 2.6-3.9zm-8-1.4a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6zm4 0a.8.8 0 1 1 0 1.6.8.8 0 0 1 0-1.6z"/></svg>',
  '网易云音乐':'<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M9 18V6l8-2v12"/><circle cx="7" cy="18" r="2.2" fill="#fff" stroke="none"/><circle cx="15" cy="16" r="2.2" fill="#fff" stroke="none"/></svg>',
  '终端':     '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 7 5 5-5 5M12 17h7"/></svg>',
  '邮件':     '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg>',
  '设置':     '<svg viewBox="0 0 24 24" fill="#fff"><path d="M12 8.5A3.5 3.5 0 1 0 12 15.5 3.5 3.5 0 0 0 12 8.5zm0 5.5a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/><path d="M20.3 13.4c.05-.45.08-.92.08-1.4s-.03-.95-.08-1.4l2-1.55a.5.5 0 0 0 .12-.64l-1.9-3.3a.5.5 0 0 0-.6-.22l-2.35.95a7.6 7.6 0 0 0-2.4-1.4l-.36-2.5A.5.5 0 0 0 14.3 1h-3.8a.5.5 0 0 0-.5.44l-.36 2.5c-.88.32-1.68.8-2.4 1.4l-2.35-.95a.5.5 0 0 0-.6.22l-1.9 3.3a.5.5 0 0 0 .12.64l2 1.55c-.05.45-.08.92-.08 1.4s.03.95.08 1.4l-2 1.55a.5.5 0 0 0-.12.64l1.9 3.3c.13.22.39.31.6.22l2.35-.95c.72.6 1.52 1.08 2.4 1.4l.36 2.5c.04.25.25.44.5.44h3.8c.25 0 .46-.19.5-.44l.36-2.5a7.6 7.6 0 0 0 2.4-1.4l2.35.95c.21.09.47 0 .6-.22l1.9-3.3a.5.5 0 0 0-.12-.64z"/></svg>',
};

const RING = document.getElementById('ring');
const hubName = document.getElementById('hubName');
const hubCount = document.getElementById('hubCount');
const R_ICON = 158;      // 内环半径
const R_CHIP = 292;      // 外环内容半径（盘沿外）
const N = APPS.length;

/* 构建内环应用图标 */
const appEls = [];
APPS.forEach((app, i) => {
  const a = i * (360 / N);          // rotate(0) = 正上方
  const el = document.createElement('div');
  el.className = 'app';
  el.style.setProperty('--a', a + 'deg');
  el.dataset.angle = a;
  el.innerHTML = `
    <div class="sel"></div>
    <div class="tile" style="background:${app.grad}">
      ${GLYPHS[app.name] || ''}
      ${app.badge ? `<span class="badge">${app.badge}</span>` : ''}
    </div>`;
  el.style.transitionDelay = `${80 + i * 22}ms`;
  el.addEventListener('mouseenter', () => setActive(i));
  RING.appendChild(el);
  appEls.push(el);
});

/* 外环 chips（按应用分组，预创建） */
const chipEls = APPS.map((app, i) => {
  const a0 = i * (360 / N);
  const list = [];
  const m = app.items.length;
  app.items.forEach((it, j) => {
    const a = a0 + (j - (m - 1) / 2) * 34;
    const an = (a % 360 + 360) % 360;
    const flip = an > 90 && an < 270;
    const el = document.createElement('div');
    el.className = 'chip';
    el.innerHTML = `<i class="dot" style="background:${it.bg};color:#fff">${it.g}</i>${it.t}`;
    el.style.transform = flip
      ? `translate(-50%,-50%) rotate(${a + 180}deg) translateY(${R_CHIP}px)`
      : `translate(-50%,-50%) rotate(${a}deg) translateY(${-R_CHIP}px)`;
    el.style.transitionDelay = `${120 + j * 26}ms`;
    el.addEventListener('mouseenter', () => { clearChipsPulse(); });
    el.addEventListener('mouseup', () => commit(it.t, el));
    RING.appendChild(el);
    list.push(el);
  });
  return list;
});

let activeApp = -1;
function setActive(i) {
  if (i === activeApp) return;
  activeApp = i;
  appEls.forEach((el, k) => el.classList.toggle('dim', k !== i));
  chipEls.forEach((list, k) => list.forEach(el => el.classList.toggle('on', k === i)));
  hubName.classList.add('swap');
  setTimeout(() => {
    hubName.textContent = APPS[i].name;
    hubCount.textContent = `${APPS[i].count} 个项目`;
    hubName.classList.remove('swap');
  }, 90);
}
function clearActive() {
  activeApp = -1;
  appEls.forEach(el => el.classList.remove('dim'));
  chipEls.forEach(list => list.forEach(el => el.classList.remove('on')));
  hubName.textContent = '启动器';
  hubCount.textContent = `${N} 个应用`;
}
function clearChipsPulse() {}

/* ── 召唤 / 收起：按住鼠标中键 ── */
let sx = 0, sy = 0;
function place(x, y) {
  const M = 240;
  x = Math.min(Math.max(x, M), innerWidth - M);
  y = Math.min(Math.max(y, M + 60), innerHeight - M);
  RING.style.left = x + 'px';
  RING.style.top = y + 'px';
}
addEventListener('mousedown', e => {
  if (e.button !== 1 && e.button !== 2) return;
  e.preventDefault();
  sx = e.clientX; sy = e.clientY;
  place(sx, sy);
  document.body.classList.add('holding');
  clearActive();
  appEls.forEach((el, i) => { el.style.transitionDelay = `${i * 22}ms`; });
});
addEventListener('mouseup', e => {
  if (e.button !== 1 && e.button !== 2) return;
  e.preventDefault();
  document.body.classList.remove('holding');
  chipEls.forEach(l => l.forEach(el => el.classList.remove('on')));
  appEls.forEach(el => el.classList.remove('dim'));
});
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });

/* 应用本身也可点击启动（demo 里鼠标松开即触发） */
appEls.forEach((el, i) => {
  el.addEventListener('mouseup', () => commit(APPS[i].name, el.querySelector('.tile')));
});

const toast = document.getElementById('toast');
let toastTimer;
function commit(label, el) {
  if (!document.body.classList.contains('holding')) return;
  if (el) { el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse'); }
  toast.textContent = `已启动：${label}`;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 1400);
  setTimeout(() => document.body.classList.remove('holding'), 160);
}

/* T 键切换明暗盘面 */
let light = true;
addEventListener('keydown', e => {
  if (e.key.toLowerCase() !== 't') return;
  light = !light;
  const root = document.documentElement;
  if (light) {
    root.style.setProperty('--disc-alpha', '0.30');
    root.style.setProperty('--text', 'rgba(20,20,26,0.88)');
    root.style.setProperty('--text-dim', 'rgba(20,20,26,0.55)');
  } else {
    root.style.setProperty('--disc-alpha', '0.16');
    root.style.setProperty('--text', 'rgba(255,255,255,0.92)');
    root.style.setProperty('--text-dim', 'rgba(255,255,255,0.6)');
  }
});

/* Esc 收起 */
addEventListener('keydown', e => {
  if (e.key === 'Escape') document.body.classList.remove('holding');
});
</script>
