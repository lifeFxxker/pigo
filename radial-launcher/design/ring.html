<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>径向启动器 · 内环主菜单</title>
<style>
:root{
  --accent:#007AFF;
  --ease:cubic-bezier(.32,.72,0,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;background:#000;padding:0;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;
  color:#fff;
}
.bg{
  position:fixed;inset:0;
  background:
    radial-gradient(1100px 720px at 18% 8%,#2D4A7C 0%,transparent 58%),
    radial-gradient(900px 640px at 84% 22%,#6B3E7A 0%,transparent 55%),
    radial-gradient(1000px 700px at 62% 92%,#1E5A52 0%,transparent 58%),
    linear-gradient(160deg,#0A0D14 0%,#14101C 48%,#08120F 100%);
}
.bg::after{
  content:'';position:absolute;inset:0;opacity:.5;
  background-image:
    linear-gradient(rgba(255,255,255,.02) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.02) 1px,transparent 1px);
  background-size:56px 56px;
}
.dock{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;padding:8px;
  background:rgba(40,40,44,.5);backdrop-filter:blur(28px) saturate(180%);
  -webkit-backdrop-filter:blur(28px) saturate(180%);
  border-radius:18px;box-shadow:0 0 0 .5px rgba(255,255,255,.12)}
.dock i{width:40px;height:40px;border-radius:10px;background:rgba(255,255,255,.12);
  box-shadow:inset 0 .5px 0 rgba(255,255,255,.2)}

.stage{position:relative;min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:30px;padding:40px 20px}
.hint{font-size:13px;color:rgba(255,255,255,.42);text-align:center;z-index:2}
.hint b{color:rgba(255,255,255,.72);font-weight:500}

.orb{
  position:relative;width:520px;height:520px;
  background:rgba(26,26,28,.55);
  backdrop-filter:blur(46px) saturate(180%);
  -webkit-backdrop-filter:blur(46px) saturate(180%);
  border-radius:50%;z-index:2;
  box-shadow:
    0 30px 80px rgba(0,0,0,.55),
    0 0 0 .5px rgba(255,255,255,.10),
    inset 0 .5px 0 rgba(255,255,255,.16);
}
.orb svg{position:absolute;inset:0;display:block}

.it{cursor:pointer;transition:opacity .22s var(--ease),transform .22s var(--ease);transform-origin:260px 260px}
.it:hover{transform:scale(1.055)}
.r2{opacity:0;transform:scale(.9);transition:opacity .3s var(--ease),transform .36s var(--ease);
  transform-origin:260px 260px;pointer-events:none}
.r2.on{opacity:1;transform:scale(1);pointer-events:auto}
.r1.dim{opacity:.38}

.mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;pointer-events:none;gap:2px}
.mid h1{font-size:17px;font-weight:500;letter-spacing:-.01em;margin-top:11px;
  max-width:210px;text-align:center;line-height:1.35}
.mid p{font-size:12px;color:rgba(255,255,255,.46);margin-top:5px}

.seg{display:flex;gap:8px;z-index:2;flex-wrap:wrap;justify-content:center}
.seg button{
  font:inherit;font-size:12.5px;font-weight:500;padding:8px 20px;border-radius:18px;cursor:pointer;
  background:rgba(120,120,128,.24);color:rgba(255,255,255,.82);
  border:.5px solid rgba(255,255,255,.12);transition:all .2s var(--ease);
}
.seg button:hover{background:rgba(120,120,128,.36);color:#fff}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:transparent}

.info{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:2;
  font-size:12px;color:rgba(255,255,255,.5);background:rgba(40,40,44,.42);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  padding:6px 15px;border-radius:14px;box-shadow:0 0 0 .5px rgba(255,255,255,.1)}
</style>
</head>
<body>
<div class="bg"></div>
<div class="info" id="badge">完整双环 · 360°</div>

<div class="stage">
  <div class="orb">
    <svg viewBox="0 0 520 520" width="520" height="520" role="img" aria-label="内环主菜单 hover 展开外环">
      <defs>
        <radialGradient id="vg" cx="50%" cy="16%" r="72%">
          <stop offset="0%" stop-color="#5B8CFF" stop-opacity=".20"/>
          <stop offset="100%" stop-color="#5B8CFF" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <circle cx="260" cy="260" r="258" fill="url(#vg)"/>
      <g id="g1"></g>
      <g id="g2"></g>
    </svg>
    <div class="mid">
      <svg width="36" height="36" viewBox="0 0 24 24" fill="none" id="ic">
        <circle cx="12" cy="12" r="2.4" stroke="#fff" stroke-width="1.8"/>
        <circle cx="12" cy="12" r="8.4" stroke="#fff" stroke-width="1.8" stroke-opacity=".5"/>
      </svg>
      <h1 id="tt">径向启动器</h1>
      <p id="ts">停在外环 · 不松手不执行</p>
    </div>
  </div>

  <p class="hint">按住 <b>鼠标中键</b> 呼出 · 移动选择 · 松开执行 · <b>Esc</b> 取消</p>

  <div class="seg">
    <button data-i="0" aria-pressed="true">应用</button>
    <button data-i="1" aria-pressed="false">最近</button>
    <button data-i="2" aria-pressed="false">剪贴板</button>
  </div>
</div>

<div class="dock"><i></i><i></i><i></i><i></i><i></i><i></i></div>

<script>
const NS='http://www.w3.org/2000/svg',C=260;
const P=(r,d)=>{const q=(d-90)*Math.PI/180;return[C+r*Math.cos(q),C+r*Math.sin(q)];};

function ring(r0,r1,a0,a1){
  const A=P(r1,a0),B=P(r1,a1),D=P(r0,a1),E=P(r0,a0);
  const L=((a1-a0)%360+360)%360>180?1:0;
  return `M${A[0].toFixed(1)} ${A[1].toFixed(1)}A${r1} ${r1} 0 ${L} 1 ${B[0].toFixed(1)} ${B[1].toFixed(1)}L${D[0].toFixed(1)} ${D[1].toFixed(1)}A${r0} ${r0} 0 ${L} 0 ${E[0].toFixed(1)} ${E[1].toFixed(1)}Z`;
}
const E=(t,a)=>{const n=document.createElementNS(NS,t);for(const k in a)n.setAttribute(k,a[k]);return n;};
const T=(x,y,s,sz,op)=>{
  const t=E('text',{x:x.toFixed(1),y:y.toFixed(1),'text-anchor':'middle','dominant-baseline':'central',
    'font-size':sz,'font-weight':500,fill:'#fff','fill-opacity':op==null?1:op});
  t.textContent=s;return t;
};

const P_={
  code:'M-5-3.2l-4 3.2 4 3.2M1-3.2l4 3.2-4 3.2M-.6-6l-2 12',
  glb:'M-6 0a6 6 0 106 0 6 6 0 10-6 0zM-6 0h12M0-6v12',
  chat:'M-6-4.4h12v7.2H-1L-6 5.6V-4.4z',
  cloud:'M0-6a6 6 0 016 6 6 6 0 01-6 6c-1.6 0-3-.6-4-1.6L-6 5.6l1.2-4A6 6 0 010-6z',
  term:'M-4.6-4.6l5 4.6-5 4.6M1.4 4.6h5',
  paint:'M-5.4-4.4l7.6 7.6M-5-4.6h10v6.4H1.4v-3.2H-5z',
  mail:'M-6-4.4h12v8.8h-12zM-6-4.4l6 4.6 6-4.6',
  doc:'M-4.6-5.4h7.2l2 2v8.8h-9.2zM2.6-5.4v2h2M-2.4-.6h4.8M-2.4 2h4.8',
  box:'M-5.4-4.4h10.8v8.8h-10.8zM-2.6-1.6h5.2M-2.6 1.6h5.2',
  fig:'M-4.6-5.4h4.6v5.4h-4.6zM0-5.4h4.6v5.4H0zM-4.6 0h4.6v5.4h-4.6zM0 0h4.6v5.4H0z'
};
const DATA=[
 {n:'应用',c:'#007AFF',ic:P_.box,it:[
   ['IDEA',P_.code],['Chrome',P_.glb],['微信',P_.chat],['豆包',P_.cloud],
   ['VS Code',P_.code],['终端',P_.term],['画图',P_.paint],['邮件',P_.mail]]},
 {n:'最近',c:'#30D158',ic:P_.doc,it:[
   ['main.rs',P_.code],['掘金',P_.glb],['微信',P_.chat],['cargo',P_.box],
   ['设置',P_.fig],['记事本',P_.doc],['Figma',P_.fig],['终端',P_.term]]},
 {n:'剪贴板',c:'#BF5AF2',ic:P_.mail,it:[
   ['设计规范.md',P_.doc],['material.io',P_.glb],['fn main(){}',P_.code],
   ['D:\\dev',P_.box],['会议纪要',P_.doc],['127.0.0.1',P_.glb],
   ['SELECT *',P_.code],['C:\\Users',P_.box]]}
];

function ico(cx,cy,r,d,active){
  const g=E('g',{transform:`translate(${cx.toFixed(1)},${cy.toFixed(1)})`});
  g.appendChild(E('circle',{r,
    fill:active?'rgba(255,255,255,.24)':'rgba(255,255,255,.11)',
    stroke:active?'rgba(255,255,255,.4)':'rgba(255,255,255,.17)','stroke-width':'1'}));
  g.appendChild(E('path',{d,stroke:'#fff','stroke-width':'1.7',fill:'none',
    'stroke-linecap':'round','stroke-linejoin':'round'}));
  return g;
}

const g1=document.getElementById('g1'),g2=document.getElementById('g2');
let cur=-1;

function build(){
  g1.textContent='';g2.textContent='';
  g1.setAttribute('class',cur<0?'':'r1 dim');
  g2.setAttribute('class','r2'+(cur<0?'':' on'));

  // 外环：完整 360 度，三等分，无缺口
  DATA.forEach((d,k)=>{
    const on=cur===k, g=E('g',{class:'it'});
    g.appendChild(E('path',{d:ring(104,186,k*120,k*120+120),
      fill:on?'rgba(255,255,255,.15)':'rgba(255,255,255,.06)',
      stroke:on?d.c:'rgba(255,255,255,.09)','stroke-width':on?'2':'1'}));
    const m=k*120+60, [x,y]=P(145,m);
    g.appendChild(ico(x,y-10,18,d.ic,on));
    g.appendChild(T(x,y+18,d.n,14.5));
    g.appendChild(T(x,y+33,d.it.length+' 项',10.5,.45));
    g.onclick=()=>{cur=cur===k?-1:k;build();};
    g1.appendChild(g);
  });

  // 内环：完整 360 度，按项目数均分
  if(cur>=0){
    const d=DATA[cur], n=d.it.length, per=360/n;
    d.it.forEach(([nm,icn],i)=>{
      const g=E('g',{class:'it'});
      g.appendChild(E('path',{d:ring(202,254,i*per,i*per+per),
        fill:'rgba(255,255,255,.085)',stroke:'rgba(255,255,255,.11)','stroke-width':'.75'}));
      const m=i*per+per/2, [x,y]=P(228,m);
      g.appendChild(ico(x,y-6,14,icn,false));
      g.appendChild(T(x,y+15,nm.length>7?nm.slice(0,7)+'…':nm,11,.9));
      g2.appendChild(g);
    });
  }

  if(cur<0){
    document.getElementById('tt').textContent='径向启动器';
    document.getElementById('ts').textContent='停在外环 · 不松手不执行';
    document.getElementById('ic').innerHTML='<circle cx="12" cy="12" r="2.4" stroke="#fff" stroke-width="1.8"/><circle cx="12" cy="12" r="8.4" stroke="#fff" stroke-width="1.8" stroke-opacity=".5"/>';
    document.getElementById('badge').textContent='仅内环 · 3 分类';
  }else{
    const d=DATA[cur];
    document.getElementById('tt').textContent=d.n;
    document.getElementById('ts').textContent=d.it.length+' 项 · 移入外环选择';
    document.getElementById('ic').innerHTML='<circle cx="12" cy="12" r="11" fill="'+d.c+'"/>';
    document.getElementById('badge').textContent=d.n+' · 外环 '+d.it.length+' 项 · 完整 360°';
  }
  document.querySelectorAll('.seg button').forEach(b=>
    b.setAttribute('aria-pressed',String(+b.dataset.i===cur)));
}
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{cur=+b.dataset.i;build();});
build();
</script>
</body>
</html>
